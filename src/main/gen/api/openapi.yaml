openapi: 3.1.0
info:
  description: "# Versioning\nThis API uses semantic versioning (MAJOR.MINOR.PATCH).\
    \ Available versions are : \n- v0.0.1 (2026-04-21) : POST /collectivities for\
    \ collectivities creation and POST /members for members creation.\n- v0.1.0 (2026-04-22)\
    \ : PATCH /collectivities/{id}/identifiers for assigning unique number and name\
    \ to a collective.\n"
  title: Agricultural federation API
  version: 0.1.0
servers:
- url: https://localhost:8080
paths:
  /collectivities:
    post:
      description: "During collectivity request body creation, only members ID are\
        \ provided to identify members. \nBut the response content includes members\
        \ information, not only their IDs.\n"
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/CreateCollectivity'
              type: array
      responses:
        "201":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Collectivity'
                type: array
          description: List of created collectivities
        "400":
          description: Collectivity without federation approval or structure missing.
        "404":
          description: Member not found.
      summary: Create list of collectivities
      x-content-type: application/json
      x-accepts:
      - application/json
  /collectivities/{id}/identifiers:
    patch:
      description: |
        This endpoint allows the federation to assign a **unique number** and **unique name** to an existing collective.
        - Once assigned, these values **cannot be changed**.
        - The number and name must be unique across all collectivities.
        - If the collective already has a number or name, the request will be rejected.
      parameters:
      - description: The internal ID of the collective (returned at creation)
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectiveIdentifiersAssignment'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
          description: Identifiers successfully assigned. Returns the updated collective.
        "400":
          description: |
            Bad request. Possible reasons:
            - Number or name already exists.
            - Collective already has a number/name assigned.
            - Invalid format.
        "404":
          description: Collective not found.
      summary: Assign unique number and name to a collective
      x-content-type: application/json
      x-accepts:
      - application/json
  /members:
    post:
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/CreateMember'
              type: array
      responses:
        "201":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Member'
                type: array
          description: List of created members
        "400":
          description: "The following case must return a bad request exception : \n\
            - Member with bad referees or without proper payment.\n- Membership dues\
            \ not paid or registration fee not paid.\n"
        "404":
          description: Either collectivity or member not found.
      summary: Create list of members
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  schemas:
    CreateCollectivity:
      example:
        federationApproval: true
        members:
        - null
        - null
        location: location
        structure:
          secretary: secretary
          vicePresident: vicePresident
          treasurer: treasurer
          president: president
      properties:
        location:
          type: string
        members:
          items:
            $ref: '#/components/schemas/MemberIdentifier'
          type: array
        federationApproval:
          type: boolean
        structure:
          $ref: '#/components/schemas/CreateCollectivityStructure'
    CreateCollectivityStructure:
      example:
        secretary: secretary
        vicePresident: vicePresident
        treasurer: treasurer
        president: president
      properties:
        president:
          type: string
        vicePresident:
          type: string
        treasurer:
          type: string
        secretary:
          type: string
    CollectivityStructure:
      example:
        secretary:
          id: id
        vicePresident:
          id: id
        treasurer:
          id: id
        president:
          id: id
      properties:
        president:
          $ref: '#/components/schemas/Member'
        vicePresident:
          $ref: '#/components/schemas/Member'
        treasurer:
          $ref: '#/components/schemas/Member'
        secretary:
          $ref: '#/components/schemas/Member'
    Collectivity:
      example:
        number: number
        members:
        - id: id
        - id: id
        name: name
        location: location
        id: id
        structure:
          secretary:
            id: id
          vicePresident:
            id: id
          treasurer:
            id: id
          president:
            id: id
      properties:
        id:
          type: string
        number:
          description: "Unique number assigned by the federation (once set, immutable)"
          type: string
        name:
          description: "Unique name assigned by the federation (once set, immutable)"
          type: string
        location:
          type: string
        structure:
          $ref: '#/components/schemas/CollectivityStructure'
        members:
          items:
            $ref: '#/components/schemas/Member'
          type: array
    CollectiveIdentifiersAssignment:
      example:
        number: FED-2026-042
        name: Collectivité des Riziculteurs d'Antsirabe
      properties:
        number:
          description: The unique number to assign
          example: FED-2026-042
          type: string
        name:
          description: The unique name to assign
          example: Collectivité des Riziculteurs d'Antsirabe
          type: string
      required:
      - name
      - number
    MemberIdentifier:
      type: string
    CreateMember:
      allOf:
      - $ref: '#/components/schemas/MemberInformation'
      example:
        collectivityIdentifier: collectivityIdentifier
        membershipDuesPaid: true
        registrationFeePaid: true
        referees:
        - null
        - null
      properties:
        collectivityIdentifier: {}
        referees:
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        registrationFeePaid: {}
        membershipDuesPaid: {}
    MemberInformation:
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          format: date
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          type: string
        profession:
          type: string
        phoneNumber:
          type: integer
        email:
          type: string
        occupation:
          $ref: '#/components/schemas/MemberOccupation'
    Member:
      allOf:
      - $ref: '#/components/schemas/MemberInformation'
      example:
        id: id
      properties:
        id:
          type: string
    Gender:
      enum:
      - MALE
      - FEMALE
      type: string
    MemberOccupation:
      enum:
      - JUNIOR
      - SENIOR
      - SECRETARY
      - TREASURER
      - VICE_PRESIDENT
      - PRESIDENT
      type: string

