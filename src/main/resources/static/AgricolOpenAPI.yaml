openapi: 3.1.0
info:
  title: Agricultural federation API
  description: |
    # Versioning
    This API uses semantic versioning (MAJOR.MINOR.PATCH). Available versions are : 
    - v0.0.1 (2026-04-21) : POST /collectivities, POST /members
    - v0.0.2 (2026-04-22) : PATCH /collectivities/{id}/identifiers
    - v0.0.3 (2026-04-23) : Membership fees, transactions, financial accounts, payments
    - v0.0.4 (2026-05-06) : Global and local statistics
  version: 0.0.4
servers:
  - url: 'https://localhost:8080'

paths:
  # ---------- Collectivités ----------
  '/collectivities':
    post:
      summary: Create list of collectivities
      description: |
        Members are provided as IDs. The response includes full member objects.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateCollectivity'
      responses:
        201:
          description: List of created collectivities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collectivity'
        400:
          description: Collectivity without federation approval or structure missing.
        404:
          description: Member not found.

  '/collectivities/{id}':
    get:
      summary: Get a specific collectivity by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: The requested collectivity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        404:
          description: Collectivity not found.

  '/collectivities/{id}/identifiers':
    patch:
      summary: Assign unique number and name to a collective
      description: Once assigned, cannot be changed. Number and name must be unique.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectiveIdentifiersAssignment'
      responses:
        200:
          description: Identifiers successfully assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        400:
          description: Number/name already exists or already assigned.
        404:
          description: Collective not found.

  '/collectivities/{id}/financialAccounts':
    get:
      summary: Get financial accounts of a collectivity at a given date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date at which to retrieve account balances
      responses:
        200:
          description: List of financial accounts with balance at given date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialAccount'
        404:
          description: Collectivity not found.

  '/collectivities/{id}/membershipFees':
    get:
      summary: Get membership fees of a collectivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of membership fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFee'
        404:
          description: Collectivity not found.
    post:
      summary: Create new membership fees for a collectivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMembershipFee'
      responses:
        200:
          description: Created membership fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFee'
        400:
          description: Invalid frequency or amount.
        404:
          description: Collectivity not found.

  '/collectivities/{id}/transactions':
    get:
      summary: Get transactions for a collectivity in a period
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        200:
          description: List of transactions between the dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectivityTransaction'
        400:
          description: 'Invalid date range (from > to).'
        404:
          description: Collectivity not found.

  # ---------- Membres ----------
  '/members':
    post:
      summary: Create list of members
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMember'
      responses:
        201:
          description: List of created members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        400:
          description: Bad referees, missing payments, or ratio not respected.
        404:
          description: Collectivity or member not found.

  '/members/{id}/payments':
    post:
      summary: Create payments for a member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMemberPayment'
      responses:
        201:
          description: List of created payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberPayment'
        400:
          description: Invalid data.
        404:
          description: Member not found.

  # ---------- Statistiques ----------
  '/collectivities/{id}/statistics':
    get:
      summary: Local statistics for a collectivity
      description: Returns earned amount and unpaid amount per active member over a period.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        200:
          description: Collectivity local statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectivityLocalStatistics'
        400:
          description: Invalid date range.
        404:
          description: Collectivity not found.

  '/collectivities/statistics':
    get:
      summary: Overall statistics for all collectivities
      description: Returns percentage of members up-to-date with dues and number of new adherents per collectivity.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        200:
          description: Overall statistics per collectivity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectivityOverallStatistics'
        400:
          description: Invalid date range.

components:
  schemas:
    # ----- Identifiants -----
    MemberIdentifier:
      type: string

    # ----- Création collectivité -----
    CreateCollectivity:
      type: object
      properties:
        location:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        federationApproval:
          type: boolean
        structure:
          $ref: '#/components/schemas/CreateCollectivityStructure'

    CreateCollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/MemberIdentifier'
        vicePresident:
          $ref: '#/components/schemas/MemberIdentifier'
        treasurer:
          $ref: '#/components/schemas/MemberIdentifier'
        secretary:
          $ref: '#/components/schemas/MemberIdentifier'

    # ----- Collectivité (réponse) -----
    Collectivity:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
        location:
          type: string
        structure:
          $ref: '#/components/schemas/CollectivityStructure'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    CollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/Member'
        vicePresident:
          $ref: '#/components/schemas/Member'
        treasurer:
          $ref: '#/components/schemas/Member'
        secretary:
          $ref: '#/components/schemas/Member'

    CollectiveIdentifiersAssignment:
      type: object
      required: [number, name]
      properties:
        number:
          type: string
        name:
          type: string

    # ----- Membres -----
    CreateMember:
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
        - type: object
          properties:
            collectivityIdentifier:
              type: string
            referees:
              type: array
              items:
                $ref: '#/components/schemas/MemberIdentifier'
            registrationFeePaid:
              type: boolean
            membershipDuesPaid:
              type: boolean

    MemberInformation:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          type: string
        profession:
          type: string
        phoneNumber:
          type: integer
        email:
          type: string
        occupation:
          $ref: '#/components/schemas/MemberOccupation'

    Member:
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
        - type: object
          properties:
            id:
              type: string
            referees:
              type: array
              items:
                $ref: '#/components/schemas/Member'

    MemberDescription:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        occupation:
          type: string

    # ----- Cotisations -----
    CreateMembershipFee:
      type: object
      properties:
        eligibleFrom:
          type: string
          format: date
        frequency:
          $ref: '#/components/schemas/Frequency'
        amount:
          type: number
        label:
          type: string

    MembershipFee:
      allOf:
        - $ref: '#/components/schemas/CreateMembershipFee'
        - type: object
          properties:
            id:
              type: string
            status:
              $ref: '#/components/schemas/ActivityStatus'

    # ----- Paiements -----
    CreateMemberPayment:
      type: object
      properties:
        amount:
          type: integer
        membershipFeeIdentifier:
          type: string
        accountCreditedIdentifier:
          type: string
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'

    MemberPayment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'
        accountCredited:
          $ref: '#/components/schemas/FinancialAccount'
        creationDate:
          type: string
          format: date

    # ----- Transactions -----
    CollectivityTransaction:
      type: object
      properties:
        id:
          type: string
        creationDate:
          type: string
          format: date
        amount:
          type: number
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'
        accountCredited:
          $ref: '#/components/schemas/FinancialAccount'
        memberDebited:
          $ref: '#/components/schemas/Member'

    # ----- Comptes financiers (polymorphe) -----
    FinancialAccount:
      oneOf:
        - $ref: '#/components/schemas/CashAccount'
        - $ref: '#/components/schemas/MobileBankingAccount'
        - $ref: '#/components/schemas/BankAccount'

    CashAccount:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer

    MobileBankingAccount:
      type: object
      properties:
        id:
          type: string
        holderName:
          type: string
        mobileBankingService:
          $ref: '#/components/schemas/MobileBankingService'
        mobileNumber:
          type: integer
        amount:
          type: number

    BankAccount:
      type: object
      properties:
        id:
          type: string
        holderName:
          type: string
        bankName:
          $ref: '#/components/schemas/Bank'
        bankCode:
          type: integer
        bankBranchCode:
          type: integer
        bankAccountNumber:
          type: integer
        bankAccountKey:
          type: integer
        amount:
          type: number

    MobileBankingService:
      type: string
      enum:
        - AIRTEL_MONEY
        - MVOLA
        - ORANGE_MONEY

    Bank:
      type: string
      enum:
        - BRED
        - MCB
        - BMOI
        - BOA
        - BGFI
        - AFG
        - ACCES_BANQUE
        - BAOBAB
        - SIPEM

    # ----- Enums -----
    Gender:
      type: string
      enum:
        - MALE
        - FEMALE

    MemberOccupation:
      type: string
      enum:
        - JUNIOR
        - SENIOR
        - SECRETARY
        - TREASURER
        - VICE_PRESIDENT
        - PRESIDENT

    Frequency:
      type: string
      enum:
        - WEEKLY
        - MONTHLY
        - ANNUALLY
        - PUNCTUALLY

    ActivityStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    PaymentMode:
      type: string
      enum:
        - CASH
        - MOBILE_MONEY
        - BANK_TRANSFER

    # ----- Statistiques -----
    CollectivityInformation:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string

    CollectivityLocalStatistics:
      type: object
      properties:
        memberDescription:
          $ref: '#/components/schemas/MemberDescription'
        earnedAmount:
          type: number
        unpaidAmount:
          type: number

    CollectivityOverallStatistics:
      type: object
      properties:
        collectivityInformation:
          $ref: '#/components/schemas/CollectivityInformation'
        newMembersNumber:
          type: integer
        overallMemberCurrentDuePercentage:
          type: number