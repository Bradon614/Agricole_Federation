openapi: 3.1.0
info:
  title: Agricultural federation API
  description: |
    # Versioning
    This API uses semantic versioning (MAJOR.MINOR.PATCH). Available versions are : 
    - v0.0.1 (2026-04-21) : POST /collectivities, POST /members
    - v0.1.0 (2026-04-22) : PATCH /collectivities/{id}/identifiers
    - v0.2.0 (2026-04-23) : GET /collectivities/{id}, GET /collectivities/{id}/financialAccounts
  version: 0.2.0
servers:
  - url: 'https://localhost:8080'

paths:
  '/collectivities':
    post:
      summary: Create list of collectivities
      description: |
        During collectivity request body creation, only members ID are provided to identify members. 
        But the response content includes members information, not only their IDs.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateCollectivity'
      responses:
        201:
          description: List of created collectivities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collectivity'
        400:
          description: Collectivity without federation approval or structure missing.
        404:
          description: Member not found.

  '/collectivities/{id}':
    get:
      summary: Get a specific collectivity by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: The requested collectivity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        404:
          description: Collectivity not found.

  '/collectivities/{id}/identifiers':
    patch:
      summary: Assign unique number and name to a collective
      description: |
        Once assigned, these values cannot be changed. Number and name must be unique.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectiveIdentifiersAssignment'
      responses:
        200:
          description: Identifiers successfully assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        400:
          description: Number/name already exists or already assigned.
        404:
          description: Collective not found.

  '/collectivities/{id}/financialAccounts':
    get:
      summary: Get financial accounts of a collectivity at a given date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date at which to retrieve account balances
      responses:
        200:
          description: List of financial accounts with balance at given date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialAccount'
        404:
          description: Collectivity not found.

  '/members':
    post:
      summary: Create list of members
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMember'
      responses:
        201:
          description: List of created members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        400:
          description: Bad referees or missing payments.
        404:
          description: Collectivity or member not found.

components:
  schemas:
    # ----- Basic identifiers -----
    MemberIdentifier:
      type: string

    # ----- Collectivity creation -----
    CreateCollectivity:
      type: object
      properties:
        location:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        federationApproval:
          type: boolean
        structure:
          $ref: '#/components/schemas/CreateCollectivityStructure'

    CreateCollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/MemberIdentifier'
        vicePresident:
          $ref: '#/components/schemas/MemberIdentifier'
        treasurer:
          $ref: '#/components/schemas/MemberIdentifier'
        secretary:
          $ref: '#/components/schemas/MemberIdentifier'

    # ----- Collectivity response -----
    Collectivity:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
        location:
          type: string
        structure:
          $ref: '#/components/schemas/CollectivityStructure'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    CollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/Member'
        vicePresident:
          $ref: '#/components/schemas/Member'
        treasurer:
          $ref: '#/components/schemas/Member'
        secretary:
          $ref: '#/components/schemas/Member'

    CollectiveIdentifiersAssignment:
      type: object
      required: [number, name]
      properties:
        number:
          type: string
        name:
          type: string

    # ----- Member creation & response -----
    CreateMember:
      type: object
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      properties:
        collectivityIdentifier:
          type: string
        referees:
          type: array
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        registrationFeePaid:
          type: boolean
        membershipDuesPaid:
          type: boolean

    MemberInformation:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          type: string
        profession:
          type: string
        phoneNumber:
          type: integer
        email:
          type: string
        occupation:
          $ref: '#/components/schemas/MemberOccupation'

    Member:
      type: object
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      properties:
        id:
          type: string

    # ----- Financial Accounts (polymorphic) -----
    FinancialAccount:
      oneOf:
        - $ref: '#/components/schemas/CashAccount'
        - $ref: '#/components/schemas/MobileBankingAccount'
        - $ref: '#/components/schemas/BankAccount'
      discriminator:
        propertyName: accountType
        mapping:
          CASH: '#/components/schemas/CashAccount'
          MOBILE_MONEY: '#/components/schemas/MobileBankingAccount'
          BANK: '#/components/schemas/BankAccount'

    CashAccount:
      type: object
      properties:
        id:
          type: string
        accountType:
          type: string
          enum: [CASH]
        amount:
          type: integer

    MobileBankingAccount:
      type: object
      properties:
        id:
          type: string
        accountType:
          type: string
          enum: [MOBILE_MONEY]
        holderName:
          type: string
        mobileBankingService:
          $ref: '#/components/schemas/MobileBankingService'
        mobileNumber:
          type: integer
        amount:
          type: number
          format: double

    BankAccount:
      type: object
      properties:
        id:
          type: string
        accountType:
          type: string
          enum: [BANK]
        holderName:
          type: string
        bankName:
          $ref: '#/components/schemas/Bank'
        bankCode:
          type: integer
        bankBranchCode:
          type: integer
        bankAccountNumber:
          type: integer
        bankAccountKey:
          type: integer
        amount:
          type: number
          format: double

    MobileBankingService:
      type: string
      enum:
        - AIRTEL_MONEY
        - MVOLA
        - ORANGE_MONEY

    Bank:
      type: string
      enum:
        - BRED
        - MCB
        - BMOI
        - BOA
        - BGFI
        - AFG
        - ACCES_BANQUE
        - BAOBAB
        - SIPEM

    # ----- Enums -----
    Gender:
      type: string
      enum:
        - MALE
        - FEMALE

    MemberOccupation:
      type: string
      enum:
        - JUNIOR
        - SENIOR
        - SECRETARY
        - TREASURER
        - VICE_PRESIDENT
        - PRESIDENT