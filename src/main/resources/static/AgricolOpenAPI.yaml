openapi: 3.1.0
info:
  title: National Federation of Agricultural Collectives API
  description: |
    REST API for the management of the National Federation of Agricultural Collectives in Madagascar.
    Updated on April 21, 2026:
    - New reinforced membership admission rules (B-2)
    - Addition of federation-wide global statistics (H)
  version: 1.1.0

servers:
  - url: 'https://localhost:8080'
tags:
  - name: A - Collectives
    description: Opening and management of agricultural collectives
  - name: B - Members
    description: Member admission, transfer and resignation (rules updated on 21/04/2026)
  - name: C - Contributions
    description: Contributions and payments management
  - name: D - Treasury
    description: Accounts and financial situation
  - name: E - Activities
    description: Activities management
  - name: F - Attendance
    description: Attendance and excuses management
  - name: G - Collective Statistics
    description: Monthly reports per collective
  - name: H - Federation Statistics
    description: Global monthly and annual reports of the federation

paths:

  # =============================================
  # A - COLLECTIVES
  # =============================================
  /collectives:
    post:
      tags: [A - Collectives]
      summary: Create a new collective (opening request)
      operationId: createCollective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectiveCreationRequest'
      responses:
        '201':
          description: Collective created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collective'

  /collectives/{id_collective}/authorize:
    patch:
      tags: [A - Collectives]
      summary: Authorize the opening of a collective
      operationId: authorizeCollective
      parameters:
        - name: id_collective
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Collective authorized successfully

  # =============================================
  # B - MEMBERS (updated 21/04/2026)
  # =============================================
  /members:
    post:
      tags: [B - Members]
      summary: Admit a new member (reinforced procedure)
      description: |
        **New admission rules (April 21, 2026)**:
        - Must be sponsored by **at least 2 confirmed members**
        - Number of sponsors from the target collective must be **greater than or equal** to the number of sponsors from other collectives
        - Must specify the nature of the relationship with each sponsor
        - Must pay 50,000 MGA admission fee + full annual mandatory contributions of the target collective
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreationRequest'
      responses:
        '201':
          description: Member admitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Sponsorship conditions or payment not respected

  /members/{id_member}/change-collective:
    patch:
      tags: [B - Members]
      summary: Change a member's collective
      operationId: changeMemberCollective
      parameters:
        - name: id_member
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_collective_id:
                  type: integer
      responses:
        '200':
          description: Collective changed successfully

  /members/{id_member}/resign:
    patch:
      tags: [B - Members]
      summary: Resign a member
      operationId: resignMember
      parameters:
        - name: id_member
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member resigned successfully

  # =============================================
  # C - CONTRIBUTIONS
  # =============================================
  /contributions:
    post:
      tags: [C - Contributions]
      summary: Record a contribution payment
      operationId: createContribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionRequest'
      responses:
        '201':
          description: Contribution recorded successfully

  # =============================================
  # D - TREASURY
  # =============================================
  /accounts:
    post:
      tags: [D - Treasury]
      summary: Create an account (Cash, Bank or Mobile Money)
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreationRequest'
      responses:
        '201':
          description: Account created successfully

  /collectives/{id_collective}/accounts:
    get:
      tags: [D - Treasury]
      summary: List accounts of a collective
      operationId: getCollectiveAccounts
      parameters:
        - name: id_collective
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDetail'

  # =============================================
  # E - ACTIVITIES
  # =============================================
  /activities:
    post:
      tags: [E - Activities]
      summary: Create an activity
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreationRequest'
      responses:
        '201':
          description: Activity created successfully

  # =============================================
  # F - ATTENDANCE
  # =============================================
  /attendances:
    post:
      tags: [F - Attendance]
      summary: Record attendances for an activity
      operationId: recordAttendances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
      responses:
        '201':
          description: Attendances recorded successfully

  # =============================================
  # G - COLLECTIVE STATISTICS
  # =============================================
  /collectives/{id_collective}/statistics/monthly:
    get:
      tags: [G - Collective Statistics]
      summary: Monthly report of a collective
      operationId: getMonthlyCollectiveReport
      parameters:
        - name: id_collective
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: string
            format: yyyy-MM
      responses:
        '200':
          description: Monthly statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyCollectiveReport'

  # =============================================
  # H - FEDERATION STATISTICS (NEW)
  # =============================================
  /federation/statistics:
    get:
      tags: [H - Federation Statistics]
      summary: Global monthly or annual federation report
      description: attendance rate, % of members up to date on contributions, number of new members
      operationId: getFederationReport
      parameters:
        - name: period_type
          in: query
          required: true
          schema:
            type: string
            enum: [monthly, yearly]
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Global federation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationReport'

components:
  schemas:

    # A - Collectives
    CollectiveCreationRequest:
      type: object
      required: [unique_number, unique_name, city, agricultural_specialty, creation_date]
      properties:
        unique_number: { type: string, example: "COLL-2026-001" }
        unique_name: { type: string }
        city: { type: string }
        agricultural_specialty: { type: string }
        creation_date: { type: string, format: date }

    Collective:
      type: object
      properties:
        id_collective: { type: integer }
        unique_number: { type: string }
        unique_name: { type: string }
        city: { type: string }
        agricultural_specialty: { type: string }
        creation_date: { type: string, format: date }
        authorization_date: { type: string, format: date, nullable: true }

    # B - Members (updated)
    MemberCreationRequest:
      type: object
      required:
        - first_name
        - last_name
        - birth_date
        - gender
        - address
        - occupation
        - phone
        - email
        - collective_id
        - sponsors
      properties:
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: string, format: date }
        gender:
          type: string
          enum: [M, F]
        address: { type: string }
        occupation: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        adhesion_date: { type: string, format: date }
        collective_id: { type: integer }
        sponsors:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/SponsorInfo'
        annual_contribution:
          type: object
          required: [amount, account_id]
          properties:
            amount: { type: number, format: decimal, minimum: 0 }
            account_id: { type: integer }

    SponsorInfo:
      type: object
      required: [sponsor_id, relationship]
      properties:
        sponsor_id: { type: integer }
        relationship:
          type: string
          example: "family"
          description: "family, friend, colleague, neighbor, etc."

    Member:
      type: object
      properties:
        id_member: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        status:
          type: string
          enum: [active, resigned]

    # C - Contributions
    ContributionRequest:
      type: object
      required: [member_id, collective_id, type, amount, payment_date, payment_method, account_id]
      properties:
        member_id: { type: integer }
        collective_id: { type: integer }
        type:
          type: string
          enum: [Periodic, OneTime]
        amount: { type: number, format: decimal }
        payment_date: { type: string, format: date }
        payment_method:
          type: string
          enum: [Cash, BankTransfer, MobileMoney]
        period: { type: string }
        account_id: { type: integer }

    # D - Accounts
    AccountCreationRequest:
      type: object
      required: [account_type, holder_name, collective_id]
      properties:
        account_type:
          type: string
          enum: [Cash, Bank, MobileMoney]
        holder_name: { type: string }
        collective_id: { type: integer }

    AccountDetail:
      type: object
      properties:
        id_account: { type: integer }
        account_type: { type: string }
        holder_name: { type: string }
        balance: { type: number, format: decimal }
        account_number: { type: string }
        phone_number: { type: string }

    # E - Activities
    ActivityCreationRequest:
      type: object
      required: [activity_type, activity_date]
      properties:
        collective_id: { type: integer, nullable: true }
        activity_type:
          type: string
          enum: [MonthlyGeneralMeeting, MandatoryTrainingJuniors, ExceptionalActivity, AnnualFederationMeeting, Other]
        activity_date: { type: string, format: date }
        is_mandatory: { type: boolean, default: true }
        target: { type: string, default: "All" }

    # F - Attendance
    AttendanceBulkRequest:
      type: object
      required: [activity_id, attendances]
      properties:
        activity_id: { type: integer }
        attendances:
          type: array
          items:
            type: object
            required: [member_id, is_present]
            properties:
              member_id: { type: integer }
              is_present: { type: boolean }
              is_excused: { type: boolean }
              excuse_reason: { type: string }

    # G - Collective Statistics
    MonthlyCollectiveReport:
      type: object
      properties:
        collective_id: { type: integer }
        month: { type: string }
        total_members: { type: integer }
        overall_attendance_rate: { type: number, format: float }
        active_members: { type: integer }

    # H - Federation Statistics
    FederationReport:
      type: object
      properties:
        period_type:
          type: string
          enum: [monthly, yearly]
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        collectives:
          type: array
          items:
            $ref: '#/components/schemas/CollectiveFederationStatistic'
        overall_totals:
          type: object
          properties:
            total_collectives: { type: integer }
            total_members: { type: integer }
            federal_attendance_rate: { type: number, format: float }

    CollectiveFederationStatistic:
      type: object
      properties:
        collective_id: { type: integer }
        collective_name: { type: string }
        city: { type: string }
        overall_attendance_rate: { type: number, format: float }
        percentage_members_up_to_date: { type: number, format: float }
        new_members: { type: integer }
        total_members: { type: integer }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []